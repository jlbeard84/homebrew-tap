# brew tap-new uses this file to generate a bottle publish workflow for the new tap
name: brew pr-pull

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
      head_sha:
        description: Expected pull request head commit SHA (optional)

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  pr-pull:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      checks: read
      contents: write
      issues: read
      pull-requests: write
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1

      - name: Pull bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          if [[ -n "$HEAD_SHA" ]]
          then
            brew pr-pull --debug --tap="$GITHUB_REPOSITORY" --head-sha="$HEAD_SHA" "$PULL_REQUEST"
          else
            brew pr-pull --debug --tap="$GITHUB_REPOSITORY" "$PULL_REQUEST"
          fi

      - name: Open bottle pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          publish_branch="bottles/pr-$PULL_REQUEST"
          git push origin "HEAD:refs/heads/$publish_branch"
          bottle_pr_body="$(printf '%s\n' \
            "Publishes the bottles built and tested for #$PULL_REQUEST." \
            "" \
            "- Adds the generated bottle checksums to the formula." \
            "- Uses the release assets uploaded by \`brew pr-pull\`." \
            "- Closes #$PULL_REQUEST when this pull request is merged.")"
          bottle_pr_url="$(gh pr create \
            --base main \
            --head "$publish_branch" \
            --title "Publish bottles for #$PULL_REQUEST" \
            --body "$bottle_pr_body")"
          echo "Bottle pull request: $bottle_pr_url"

          # Events created with GITHUB_TOKEN do not start other workflows, so
          # explicitly run the required checks against the generated branch.
          gh workflow run tests.yml --ref "$publish_branch"
